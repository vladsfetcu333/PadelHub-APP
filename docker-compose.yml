# Docker Compose — Postgres + pgvector for Phase 4 (production migration from SQLite).
# Not used in Phase 0 development. Run with: docker compose up -d
version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: padel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: padel_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
